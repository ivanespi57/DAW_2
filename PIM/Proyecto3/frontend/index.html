<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Denuncia Anónima</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h1>Sistema de Denuncias Anónimas</h1>

    <div class="container">

        <h2>Crear nueva conversación</h2>
        <input type="password" id="newPassword" placeholder="Contraseña">
        <button onclick="createConversation()">Crear</button>

        <hr>

        <h2>Continuar conversación</h2>
        <input type="text" id="code" placeholder="Código conversación">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="loginConversation()">Acceder</button>

    </div>

<script src="js/main.js"></script>
</body>
</html>
