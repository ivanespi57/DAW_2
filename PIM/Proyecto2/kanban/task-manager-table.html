<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <style>
        <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Inter", sans-serif;
        background: #0f0f13;
        color: #eaeaea;
        padding: 30px;
        min-height: 100vh;
    }

    .container {
        max-width: 1100px;
        margin: 0 auto;
        background: rgba(255,255,255,0.04);
        backdrop-filter: blur(10px);
        border-radius: 14px;
        box-shadow: 0 0 30px rgba(0, 255, 200, 0.1);
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.06);
    }

    .header {
        padding: 35px;
        text-align: center;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .header h1 {
        font-size: 2.2em;
        color: #5df2d6;
        font-weight: 700;
        letter-spacing: 1px;
    }

    .header p {
        margin-top: 8px;
        font-size: 0.95em;
        opacity: 0.75;
    }

    .table-container {
        padding: 25px;
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 650px;
    }

    thead {
        background: rgba(255,255,255,0.05);
    }

    th {
        padding: 14px 10px;
        text-align: left;
        font-weight: 600;
        color: #7df6dd;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        font-size: 0.85em;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    td {
        padding: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        color: #e5e5e5;
        vertical-align: top;
    }

    tr:hover:not(.new-row) {
        background: rgba(255,255,255,0.05);
    }

    .new-row {
        background: rgba(0,255,200,0.05);
    }

    textarea, select {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        color: #eaeaea;
        font-size: 14px;
        resize: none;
    }

    textarea:focus, select:focus {
        outline: none;
        border-color: #5df2d6;
        box-shadow: 0 0 6px #2bbfa5;
    }

    .view-mode {
        padding: 8px;
        cursor: pointer;
        border-radius: 6px;
        transition: 0.2s;
    }

    .view-mode:hover {
        background: rgba(255,255,255,0.05);
    }

    .status-badge, .priority-badge {
        padding: 6px 14px;
        border-radius: 25px;
        font-size: 0.85em;
        font-weight: 600;
        display: inline-block;
    }

    /* STATUS */
    .status-someday { background: #394a6d; color: #9fc1ff; }
    .status-todo { background: #6b3d2d; color: #ffb48a; }
    .status-progress { background: #244c39; color: #7fffd4; }
    .status-done { background: #473d54; color: #d7b5ff; }
    .status-today { background: #1a4636; color: #5df2d6; }
    .status-thisweek { background: #5c2f47; color: #ff96d7; }
    .status-deleted { background: #4b2f3a; color: #ff6f91; }
    .status-tomorrow { background: #4a4d2d; color: #eaff6d; }

    /* PRIORITY */
    .priority-low { background: #244c39; color: #7fffd4; }
    .priority-medium { background: #6b3d2d; color: #ffb48a; }
    .priority-high { background: #4e2d2d; color: #ff6f6f; }
    .priority-top { background: #4b0040; color: #ff73ff; }

    .actions {
        display: flex;
        gap: 8px;
    }

    button {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85em;
        transition: 0.25s;
    }

    .btn-save {
        background: #5df2d6;
        color: #0f0f13;
    }

    .btn-save:hover {
        background: #34d7b9;
        transform: translateY(-2px);
    }

    .btn-delete {
        background: #ff6f91;
        color: #0f0f13;
    }

    .btn-delete:hover {
        background: #ff547d;
        transform: translateY(-2px);
    }

    .btn-cancel {
        background: #777;
        color: white;
    }

    .btn-cancel:hover {
        background: #555;
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: #5df2d6;
        font-size: 1.2em;
    }

    .error {
        background: rgba(255,0,0,0.1);
        color: #ff6f91;
        padding: 15px;
        margin: 20px;
        border-left: 4px solid #ff6f91;
        border-radius: 4px;
    }

    @media (max-width: 750px) {
        th, td {
            padding: 10px 6px;
            font-size: 0.8em;
        }

        .actions {
            flex-direction: column;
        }

        button {
            width: 100%;
        }
    }
</style>

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Gestor de Tareas</h1>
            <p>Doble click para editar • Responsive</p>
        </div>
        <div class="table-container">
            <div id="loading" class="loading">Cargando tareas...</div>
            <div id="error" class="error" style="display: none;"></div>
            <table id="taskTable" style="display: none;">
                <thead>
                    <tr>
                        <th style="width: 40%">Descripción</th>
                        <th style="width: 20%">Estado</th>
                        <th style="width: 15%">Prioridad</th>
                        <th style="width: 25%">Acciones</th>
                    </tr>
                </thead>
                <tbody id="taskBody"></tbody>
            </table>
        </div>
    </div>

    <script src="tasks.js"></script>
    <script>
        class TaskManager {
            constructor() {
                this.tasks = [];
                this.editingId = null;
                this.init();
            }

            async init() {
                await this.loadTasks();
                this.render();
            }

            async loadTasks() {
                try {
                    this.tasks = await TaskAPI.getTasks();
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('taskTable').style.display = 'table';
                    this.hideError();
                } catch (error) {
                    this.showError('Error al cargar las tareas: ' + error.message);
                }
            }

            showError(message) {
                const errorDiv = document.getElementById('error');
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }

            hideError() {
                document.getElementById('error').style.display = 'none';
            }

            autoResize(textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = textarea.scrollHeight + 'px';
            }

            getStatusBadge(status) {
                const statusClass = status.toLowerCase().replace(' ', '');
                return `<span class="status-badge status-${statusClass}">${status}</span>`;
            }

            getPriorityBadge(priority) {
                return `<span class="priority-badge priority-${priority}">${priority}</span>`;
            }

            createEditRow(task = null) {
                const isNew = !task;
                const tr = document.createElement('tr');
                if (isNew) tr.className = 'new-row';

                tr.innerHTML = `
                    <td>
                        <textarea placeholder="Escribe la descripción de la tarea...">${task ? task.description : ''}</textarea>
                    </td>
                    <td>
                        <select>
                            <option value="Some day" ${task?.status === 'Some day' ? 'selected' : ''}>Some day</option>
                            <option value="To do" ${task?.status === 'To do' ? 'selected' : ''}>To do</option>
                            <option value="In progress" ${task?.status === 'In progress' ? 'selected' : ''}>In progress</option>
                            <option value="Done" ${task?.status === 'Done' ? 'selected' : ''}>Done</option>
                            <option value="Today" ${task?.status === 'Today' ? 'selected' : ''}>Today</option>
                            <option value="Tomorrow" ${task?.status === 'Tomorrow' ? 'selected' : ''}>Tomorrow</option>
                            <option value="Deleted" ${task?.status === 'Deleted' ? 'selected' : ''}>Deleted</option>
                            <option value="Someday" ${task?.status === 'Someday' ? 'selected' : ''}>Some day</option>
                        </select>
                    </td>
                    <td>
                        <select>
                            <option value="low" ${task?.priority === 'low' ? 'selected' : ''}>Low</option>
                            <option value="medium" ${task?.priority === 'medium' ? 'selected' : ''}>Medium</option>
                            <option value="high" ${task?.priority === 'high' ? 'selected' : ''}>High</option>
                            <option value="top" ${task?.priority === 'top' ? 'selected' : ''}>Top</option>
                        </select>
                    </td>
                    <td>
                        <div class="actions">
                            <button class="btn-save">${isNew ? '➕ Crear' : '💾 Guardar'}</button>
                            ${!isNew ? '<button class="btn-cancel">❌ Cancelar</button>' : ''}
                        </div>
                    </td>
                `;

                const textarea = tr.querySelector('textarea');
                textarea.addEventListener('input', () => this.autoResize(textarea));
                this.autoResize(textarea);

                const saveBtn = tr.querySelector('.btn-save');
                saveBtn.addEventListener('click', () => {
                    const description = textarea.value.trim();
                    const status = tr.querySelectorAll('select')[0].value;
                    const priority = tr.querySelectorAll('select')[1].value;

                    if (isNew) {
                        this.createTask(description, status, priority);
                    } else {
                        this.updateTask(task.id, description, status, priority);
                    }
                });

                if (!isNew) {
                    const cancelBtn = tr.querySelector('.btn-cancel');
                    cancelBtn.addEventListener('click', () => {
                        this.editingId = null;
                        this.render();
                    });
                }

                return tr;
            }

            createViewRow(task) {
                const tr = document.createElement('tr');
                tr.dataset.id = task.id;

                tr.innerHTML = `
                    <td>
                        <div class="view-mode">${task.description}</div>
                    </td>
                    <td>
                        <div class="view-mode">${this.getStatusBadge(task.status)}</div>
                    </td>
                    <td>
                        <div class="view-mode">${this.getPriorityBadge(task.priority)}</div>
                    </td>
                    <td>
                        <div class="actions">
                            <button class="btn-delete">🗑️ Eliminar</button>
                        </div>
                    </td>
                `;

                const viewCells = tr.querySelectorAll('.view-mode');
                viewCells.forEach(cell => {
                    cell.addEventListener('dblclick', () => {
                        this.editingId = task.id;
                        this.render();
                    });
                });

                const deleteBtn = tr.querySelector('.btn-delete');
                deleteBtn.addEventListener('click', () => this.deleteTask(task.id));

                return tr;
            }

            render() {
                const tbody = document.getElementById('taskBody');
                tbody.innerHTML = '';

                this.tasks.forEach(task => {
                    if (task.id === this.editingId) {
                        tbody.appendChild(this.createEditRow(task));
                    } else {
                        tbody.appendChild(this.createViewRow(task));
                    }
                });

                tbody.appendChild(this.createEditRow());
            }

            async createTask(description, status, priority) {
                if (!description) {
                    alert('La descripción es obligatoria');
                    return;
                }

                try {
                    await TaskAPI.createTask(description, status, priority);
                    await this.loadTasks();
                    this.render();
                } catch (error) {
                    alert('Error al crear la tarea: ' + error.message);
                }
            }

            async updateTask(id, description, status, priority) {
                if (!description) {
                    alert('La descripción es obligatoria');
                    return;
                }

                try {
                    await TaskAPI.updateTask(id, description, status, priority);
                    await this.loadTasks();
                    this.editingId = null;
                    this.render();
                } catch (error) {
                    alert('Error al actualizar la tarea: ' + error.message);
                }
            }

            async deleteTask(id) {
                if (!confirm('¿Estás seguro de eliminar esta tarea?')) {
                    return;
                }

                try {
                    await TaskAPI.deleteTask(id);
                    await this.loadTasks();
                    this.render();
                } catch (error) {
                    alert('Error al eliminar la tarea: ' + error.message);
                }
            }
        }

        const taskManager = new TaskManager();
    </script>
</body>
</html>
