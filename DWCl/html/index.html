<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios</title>
    <script src="/DWCl/Scripts/script1.js"></script>
    <script src="/DWCl/Scripts/script2.js"></script>
    <style>

            *{
                margin: 10px;
            }
            body { 
                font-family: sans-serif;
                display: flex; 
                justify-content: center; 
                align-items: center; 
                height: 100vh; 
                background-color: #f0f0f0; 
            }

            .ejer { 
                text-align: center; 
                padding: 20px; 
                border: 1px solid #ccc; 
                border-radius: 8px; 
                background-color: #fff; 
                box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            }

            .resultado { 
                font-size: 1.5em; 
                font-weight: bold; 
                margin-top: 15px; 
            }

            table{
               border-collapse: collapse;
               width: 100%; 
            }
            td{
                border: 3px solid red;
            }
            
        </style>
</head>
<body>
    <div class="ejer">
        <h1>Ejercicio 1</h1>
        <h2>Cálculo de salario</h2>

        <form>
            <label for="nombre">Nombre: </label>
            <input type="text" id="nom">
            <br>
            <label for="salActual">Salario Actual: </label>
            <input type="number" id="salarioAct">
            <br>
            <label for="numeroH">Numero de hijos: </label>
            <input type="number" id="numHijos">
            <br>
            <label for="edad">Edad: </label>
            <input type="number" id="ed">
            <br>
            <button type="submit" onclick="procesar(event)">Enviar</button>
        </form>
        <hr>
        
        <p id="res" class="resultado">Resultado: </p>
        <hr>

        <h1>Ejercicio 2</h1>

        <form>
            <label for="filas">Filas: </label>
            <input type="number" id="filas" min="1"><br>
            <label for="filas">Columnas: </label>
            <input type="number" id="columnas" min="1"><br>

            <button onclick="dibujarTabla(event)">Dibujar tabla</button>
        </form>
        <div id="tabla"></div>  
    </div>

    
</body>
</html>
