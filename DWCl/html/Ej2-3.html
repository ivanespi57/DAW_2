<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios</title>

    <script src="/DWCl/Scripts/2-3/script1.js"></script>
    <script src="/DWCl/Scripts/2-3/script2.js"></script>
    <script src="/DWCl/Scripts/2-3/script3.js"></script>


    <style>
        * {
            margin: 10px;
        }

        body { 
            font-family: sans-serif;
            display: flex; 
            justify-content: center; 
            background-color: #f0f0f0; 
            padding: 20px;
        }

        .ejer { 
            text-align: center; 
            padding: 20px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            background-color: #fff; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            max-width: 600px;
        }

        .resultado { 
            font-size: 1.3em; 
            font-weight: bold; 
            margin-top: 15px; 
        }

        table {
           border-collapse: collapse;
           width: 100%; 
        }

        td {
            border: 3px solid red;
        }
    </style>
</head>
<body>
    <div class="ejer">
        
        <h1>Ejercicio 1</h1>
        <h2>Cálculo de salario</h2>
        <form>
            <label>Número a multiplicar:</label>
            <input type="number" id="num"><br>
            
            <button type="button" onclick="multi(event)">Multiplicar</button>
        </form>
        <p id="result">Resultado:</p>
        <hr>
            
    </div>
    <div class="ejer">
        <h1>Calculadora de cuenta del restaurante</h1>

        <label>Total de comensales:</label>
        <input type="number" id="total" min="1"><br>

        <label>Mayores de 65 años:</label>
        <input type="number" id="mayores" min="0"><br>

        <label>Niños (menores de 10 años):</label>
        <input type="number" id="ninos" min="0"><br>

        <hr>

        <h3>Menús para adultos (precios sin IVA)</h3>
        <p>Menú del Día: 12.50 €</p>
        <p>Menú Especial: 18.75 €</p>
        <p>Menú Premium: 25.00 €</p>

        <label>Adultos que eligen Menú del Día:</label>
        <input type="number" id="menu1" min="0"><br>

        <label>Adultos que eligen Menú Especial:</label>
        <input type="number" id="menu2" min="0"><br>

        <button onclick="calcularCuenta()">Calcular cuenta</button>

        <p id="resultado"></p>
    </div>
</body>
</html>
